name: Cars
version: '${project.version}'
main: fi.alavesa.cars.CarsPlugin
softdepend: [Labra, BetterModel]
api-version: '1.21'
description: Config-driven rideable vehicles - real WASD driving; the body is a BetterModel model rendered on and auto-followed by the car.
commands:
  car:
    description: Create, edit and spawn vehicles
    usage: |
      /car create <id> <model>   (model = the BetterModel model name you authored)
      /car edit <id> <name|model|max-speed|acceleration|turn-rate|sound|...> <value>
      /car seat <id> driver|<n> <x> <y> <z>
      /car seats <id>
      /car list
      /car spawn <id>
      /car remove        (cars within 16 blocks)
      /car monorail line|node|build|cart|list|remove|scrap <name>
permissions:
  cars.admin:
    description: Manage vehicles
    default: op
